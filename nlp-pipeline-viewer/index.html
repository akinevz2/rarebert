<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP Pipeline Viewer</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        #terminal {
            width: 100%;
            height: 100%;
            padding: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>NLP Pipeline Viewer</h1>
        <div class="controls">
            <button id="loadBtn">Load Pipeline</button>
            <button id="prevBtn" disabled>Previous</button>
            <button id="continueBtn" disabled>Continue</button>
            <button id="resetBtn" disabled>Reset</button>
        </div>
        <div class="terminal-container">
            <div id="terminal"></div>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const loadBtn = document.getElementById('loadBtn');
        const prevBtn = document.getElementById('prevBtn');
        const continueBtn = document.getElementById('continueBtn');
        const resetBtn = document.getElementById('resetBtn');

        let pipelineData = null;
        let currentIndex = 0;
        let isLoaded = false;

        loadBtn.addEventListener('click', async () => {
            try {
                const response = await fetch('pipeline.json');
                pipelineData = await response.json();
                isLoaded = true;
                currentIndex = 0;
                displayCurrentStage();
                loadBtn.disabled = true;
                prevBtn.disabled = true;
                continueBtn.disabled = false;
                resetBtn.disabled = false;
            } catch (error) {
                terminal.innerHTML = '<span style="color: #ff6b6b;">Error loading pipeline.json: ' + error.message + '</span>';
            }
        });

        const buttons = {
            "prevBtn": prevBtn,
            "nextBtn": nextBtn,
            "resetBtn": resetBtn,
            "continueBtn": continueBtn
        };
        const handlers = {
            "prevBtn": () => {
                if (currentIndex > 0) {
                    currentIndex--;
                    displayCurrentStage();
                }
            },
            "nextBtn": () => {
                if (currentIndex < pipelineData.pipeline.length - 1) {
                    currentIndex++;
                    displayCurrentStage();
                }
            },
            "resetBtn": () => {
                currentIndex = 0;
                displayCurrentStage();
            },
            "continueBtn": () => {
                if (currentIndex < pipelineData.pipeline.length - 1) {
                    currentIndex++;
                    displayCurrentStage();
                }
            }
        };

        Object.values(buttons).forEach(button => {
            button.addEventListener('click', handlers[button.id]);
        });

        // Function to display the current stage in the terminal
        function displayCurrentStage() {
            if (!pipelineData || !pipelineData.pipeline[currentIndex]) return;

            const stage = pipelineData.pipeline[currentIndex];
            const render_command = (stage) => {
                let command = stage.module;
                if (stage.args && Object.keys(stage.args).length > 0) {
                    const runtime = stage.runtime || 'echo ERROR:';
                    if (runtime in ['python', 'bash', 'java', 'sh']) {
                        // we have a native runtime
                        const args = `${Object.entries(stage.args).map(([idx, value]) => `--${JSON.stringify(value)}`).join(' ')}`;
                        command = `${runtime} ${stage.module}`;
                    } else {
                        // we are using BASH-style arguments
                        const args = `${Object.entries(stage.args).map(([key, value]) => `--${JSON.stringify(key+"="+value)}`).join(' ')}`;
                        command = `${runtime} ${stage.module}`;
                    }
                    const args = `${Object.entries(stage.args).map(([key, value]) => `--${key} ${JSON.stringify(value)}`).join(' ')}`;
                    const command = `${stage.runtime} ${stage.module} ${args}`;
                }
                return command;
            };
                    // ${Object.keys(stage.args).length > 0 ? '<p><strong>Pipeline:Arguments >> </strong></p>' : ''}
                    // ${Object.entries(stage.args).map(([key, value]) => `<p style="color: #ffd93d;">  ${key}: ${JSON.stringify(value)}</p>`).join('')}
            terminal.innerHTML = `
                <pre class="stage">
                    <h2>Pipeline:Stage ::> ${currentIndex + 1} / ${pipelineData.pipeline.length}</h2>
                    <p><strong>Pipeline:Module >> </strong> ${stage.module}</p>
                    <p><strong>Pipeline:Runtime >> </strong> ${stage.runtime}</p>
                    <p><strong>Pipeline:Printout >> </strong> ${stage.printout}</p>
                    <p><em><strong>Current::command_line >> ${render_command(stage)}</strong></em></p>
                </pre>
            `;
        }
    </script>
</body>
</html>
