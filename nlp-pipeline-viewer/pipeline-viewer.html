<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP Pipeline Viewer</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        #terminal {
            width: 100%;
            height: 100%;
            padding: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>NLP Pipeline Viewer</h1>
        <div class="controls">
            <button id="loadBtn">Load Pipeline</button>
            <button id="prevBtn" disabled>Previous</button>
            <button id="continueBtn" disabled>Continue</button>
            <button id="resetBtn" disabled>Reset</button>
        </div>
        <div class="terminal-container">
            <div id="terminal"></div>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const loadBtn = document.getElementById('loadBtn');
        const prevBtn = document.getElementById('prevBtn');
        const continueBtn = document.getElementById('continueBtn');
        const resetBtn = document.getElementById('resetBtn');

        let pipelineData = null;
        let currentIndex = 0;
        let isLoaded = false;

        loadBtn.addEventListener('click', async () => {
            try {
                const response = await fetch('pipeline.json');
                pipelineData = await response.json();
                isLoaded = true;
                currentIndex = 0;
                displayCurrentStage();
                loadBtn.disabled = true;
                prevBtn.disabled = true;
                continueBtn.disabled = false;
                resetBtn.disabled = false;
            } catch (error) {
                terminal.innerHTML = '<span style="color: #ff6b6b;">Error loading pipeline.json: ' + error.message + '</span>';
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                displayCurrentStage();
            }
        });

        continueBtn.addEventListener('click', () => {
            if (currentIndex < pipelineData.pipeline.length - 1) {
                currentIndex++;
                displayCurrentStage();
            }
        });
                resetBtn.disabled = false;
            } catch (error) {
                terminal.innerHTML = '<span style="color: #ff6b6b;">Error loading pipeline.json: ' + error.message + '</span>';
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                displayCurrentStage();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < pipelineData.pipeline.length - 1) {
                currentIndex++;
                displayCurrentStage();
            }
        });

        resetBtn.addEventListener('click', () => {
            currentIndex = 0;
            displayCurrentStage();
        });

        function displayCurrentStage() {
            if (!pipelineData || !pipelineData.pipeline[currentIndex]) return;

            const stage = pipelineData.pipeline[currentIndex];
            terminal.innerHTML = `
                <div class="stage">
                    <h2>Stage ${currentIndex + 1} / ${pipelineData.pipeline.length}</h2>
                    <p><strong>Module:</strong> ${stage.module}</p>
                    <p><strong>Runtime:</strong> ${stage.runtime}</p>
                    <p><strong>Printout:</strong> ${stage.printout}</p>
                    ${Object.keys(stage.args).length > 0 ? '<p><strong>Arguments:</strong></p>' : ''}
                    ${Object.entries(stage.args).map(([key, value]) => `<p style="color: #ffd93d;">  ${key}: ${JSON.stringify(value)}</p>`).join('')}
                </div>
            `;
        }
    </script>
</body>
</html>
